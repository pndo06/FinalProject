<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Final Project Interactive Visualization</title>
        
        <link rel="stylesheet" href="style.css">
        <script type="module" src="vis.js"></script>
    </head>
    
    <body>
        <header>
            <h1>How Hot Could Earth Get by 2100?</h1>
            <p>Comparing global temperature projections under three emissions scenarios</p>
        </header>
        
        <main>
            <section class="controls">
                <h3>Emissions Scenarios</h3>
                <div class="scenario-buttons">
                    <button class="scenario-button active" data-scenario="SSP1-2.6">
                        Low Emissions
                    </button>
                    
                    <button class="scenario-button active" data-scenario="SSP2-4.5">
                        Moderate Emissions
                    </button>
                    
                    <button class="scenario-button active" data-scenario="SSP5-8.5">
                        High Emissions
                    </button>
                </div>
                
                <div id="chart"></div>
            </section>
        </main>
    </body>
</html>
